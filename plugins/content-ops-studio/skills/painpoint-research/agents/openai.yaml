interface:
  display_name: "Painpoint Research"
  short_description: "Research and review evidence-backed audience painpoints"
  default_prompt: "Use $painpoint-research to plan current-source research, retain citations, write only pending painpoints, and stop for my item-level G2 decisions."
dependencies:
