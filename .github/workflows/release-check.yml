name: Release readiness check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Check version and changelog alignment
        run: |
          node -e 'const p=require("./package.json");const m=require("./plugins/content-ops-studio/.codex-plugin/plugin.json");if(p.version!==m.version)process.exit(1);const fs=require("fs");if(!fs.readFileSync("CHANGELOG.md","utf8").includes(p.version))process.exit(1)'
      - name: Confirm forbidden configuration is absent
        run: |
          test ! -e plugins/content-ops-studio/.app.json
          test ! -e plugins/content-ops-studio/hooks
          test -e plugins/content-ops-studio/.mcp.json
      - run: pnpm release:absolute-path-audit
      - run: pnpm release:privacy-scan
      - run: pnpm release:links
      - run: pnpm release:cross-platform
